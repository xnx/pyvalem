# How Read the Docs builds the documentation at https://pyvalem.readthedocs.io/
# (see https://docs.readthedocs.com/platform/stable/config-file/v2.html).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    # PyValem with the docs dependency group of pyproject.toml, which needs
    # pip 25.1 or later.
    install:
      - python -m pip install --upgrade pip
      - python -m pip install . --group docs

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true
