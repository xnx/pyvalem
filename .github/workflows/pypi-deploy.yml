name: pypi-deploy

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    name: Build, test and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl --group dev
          python -m pytest tests README.rst docs/source
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Attestations need Trusted Publishing, which isn't set up yet.
          attestations: false
